[project]
name = "perfect-day-backend"
version = "0.1.0"
description = "Бэкенд планировщика «Идеальный День»"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "fastapi-cache2>=0.2.2",
    "jinja2>=3.1",
    "celery[redis]>=5.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "testcontainers[postgres,redis]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# Тексты для пользователя на русском — кириллица в строках не ошибка
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

# Чистые движки алгоритмов — строгая типизация (ADR: чистое ядро)
[[tool.mypy.overrides]]
module = ["app.modules.*.engine", "app.modules.planner.*"]
strict = true

[[tool.mypy.overrides]]
module = ["app.workers.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["docker: tests that start PostgreSQL or Redis in Docker via testcontainers"]
testpaths = ["tests"]
