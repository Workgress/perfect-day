<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0e11" />
    <script>
      ;(function () {
        var theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        try {
          var stored = JSON.parse(localStorage.getItem('pd-theme') || 'null')
          var mode = stored && stored.state && stored.state.mode
          if (mode === 'light' || mode === 'dark') theme = mode
        } catch (error) {}
        document.documentElement.dataset.theme = theme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#0e0e11' : '#f6f5f1')
      })()
    </script>
    <title>Идеальный день</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
